<title>Aulas em desenho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
/* Uma aula por tela: desenho em cima, "o que é o quê" e a conta embaixo. */
:root {
  --bg: hsl(195 30% 97%);
  --card: hsl(0 0% 100%);
  --fg: hsl(200 30% 14%);
  --muted: hsl(200 12% 42%);
  --line: hsl(195 20% 86%);
  --accent: hsl(189 80% 34%);
  --accent-soft: hsl(189 70% 92%);
  --water: hsl(210 85% 55%);
  --water-soft: hsl(210 85% 88%);
  --warm: hsl(24 90% 52%);
  --warm-soft: hsl(24 90% 90%);
  --good: hsl(150 55% 36%);
  --ink: hsl(200 30% 14%);
  --display: "Fraunces", Georgia, serif;
  --read: "Source Serif 4", Georgia, serif;
  --ui: "DM Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: hsl(200 25% 8%); --card: hsl(200 22% 12%); --fg: hsl(195 20% 92%); --muted: hsl(195 10% 66%);
  --line: hsl(200 15% 24%); --accent: hsl(189 80% 56%); --accent-soft: hsl(189 50% 18%);
  --water: hsl(210 90% 66%); --water-soft: hsl(210 50% 24%); --warm: hsl(24 95% 62%); --warm-soft: hsl(24 50% 22%);
  --good: hsl(150 55% 55%); --ink: hsl(195 20% 92%); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: hsl(200 25% 8%); --card: hsl(200 22% 12%); --fg: hsl(195 20% 92%); --muted: hsl(195 10% 66%);
  --line: hsl(200 15% 24%); --accent: hsl(189 80% 56%); --accent-soft: hsl(189 50% 18%);
  --water: hsl(210 90% 66%); --water-soft: hsl(210 50% 24%); --warm: hsl(24 95% 62%); --warm-soft: hsl(24 50% 22%);
  --good: hsl(150 55% 55%); --ink: hsl(195 20% 92%); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); margin: 0; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.topo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.abas { display: flex; flex-wrap: wrap; gap: 6px; }
.abas button { font: 500 14px var(--ui); border: 0; border-radius: 999px; padding: 8px 14px; background: var(--card); color: var(--muted); cursor: pointer; }
.abas button[aria-pressed="true"] { background: var(--accent); color: var(--card); }
.conta-tela { font: 500 13px var(--ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.cartao { background: var(--card); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.olho { font: 600 12px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
h1 { font: 600 clamp(24px, 4vw, 32px)/1.15 var(--display); margin: 2px 0 0; text-wrap: balance; }
figure { margin: 0; background: var(--bg); border-radius: 14px; padding: 8px; overflow-x: auto; }
figure svg { display: block; width: 100%; max-width: 560px; height: auto; margin: 0 auto; }
.grade { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grade > * { min-width: 0; }
@media (max-width: 640px) { .grade { grid-template-columns: 1fr; } }
h2 { font: 600 13px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.pecas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pecas li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: baseline; font: 16px/1.4 var(--read); }
.pecas .seta { color: var(--muted); font-family: var(--ui); }
.pecas b { font-weight: 600; color: var(--accent); }
.texto { font: 17px/1.55 var(--read); margin: 0; }
.conta { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font: 16px/1.5 var(--read); margin-top: 10px; }
.conta strong { font-family: var(--ui); font-weight: 600; }
.nav { display: flex; justify-content: space-between; gap: 12px; }
.nav button { font: 600 15px var(--ui); border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer; }
#voltar { background: var(--card); color: var(--fg); }
#proximo { background: var(--accent); color: var(--card); }
.nav button:disabled { opacity: .35; cursor: default; }
button:focus { outline: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
/* desenho */
svg text { font: 500 12px var(--ui); fill: var(--fg); }
svg .t-forte { font-weight: 600; fill: var(--accent); }
svg .t-calor { font-weight: 600; fill: var(--warm); }
svg .t-agua { font-weight: 600; fill: var(--water); }
svg .t-fraco { fill: var(--muted); }
.tinta { stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tinta-f { stroke: var(--muted); fill: none; stroke-width: 1.5; stroke-dasharray: 4 4; }
.agua { fill: var(--water-soft); stroke: var(--water); stroke-width: 2; }
.calor { fill: var(--warm-soft); stroke: var(--warm); stroke-width: 2; }
.realce { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.cheio { fill: var(--accent); }
.cheio-agua { fill: var(--water); }
.cheio-calor { fill: var(--warm); }
.fundo { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
.fluxo { stroke: var(--water); stroke-width: 4; fill: none; stroke-dasharray: 8 10; stroke-linecap: round; animation: correr 0.9s linear infinite; }
.fluxo-pouco { stroke: var(--water); stroke-width: 3; fill: none; stroke-dasharray: 4 26; stroke-linecap: round; animation: correr-pouco 1.8s linear infinite; }
@keyframes correr-pouco { to { stroke-dashoffset: -30; } }
figure + .prop { margin-top: 12px; }
.prop { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.prop li { font: 16px/1.45 var(--read); display: flex; flex-direction: column; gap: 2px; }
.prop .cab { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 600 15px var(--ui); }
.selo { font: 600 11px var(--ui); letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
.selo-direta { background: var(--accent-soft); color: var(--accent); }
.selo-inversa { background: var(--warm-soft); color: var(--warm); }
.selo-outra { background: var(--bg); color: var(--muted); }
.fluxo-e { stroke: var(--accent); stroke-width: 4; fill: none; stroke-dasharray: 3 12; stroke-linecap: round; animation: correr 0.9s linear infinite; }
.sobe { stroke: var(--warm); stroke-width: 3; fill: none; stroke-dasharray: 6 8; animation: correr 0.8s linear infinite; }
.gira { animation: girar 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
.onda { animation: andar 1.6s linear infinite; }
@keyframes correr { to { stroke-dashoffset: -18; } }
@keyframes girar { to { transform: rotate(360deg); } }
@keyframes andar { to { transform: translateX(100px); } }
/* O movimento aqui explica a ideia (a água corre, a onda anda): fica, só mais lento. */
@media (prefers-reduced-motion: reduce) {
  .fluxo, .fluxo-e, .sobe { animation-duration: 1.8s; }
  .fluxo-pouco { animation-duration: 3.6s; }
  .gira { animation-duration: 4.8s; }
  .onda { animation-duration: 3.2s; }
}
</style>

<div class="wrap">
  <div class="topo">
    <div class="abas" id="abas" role="group" aria-label="Matéria"></div>
    <span class="conta-tela" id="contador"></span>
  </div>
  <article class="cartao" id="cartao" aria-live="polite"></article>
  <div class="nav">
    <button id="voltar" type="button">‹ Voltar</button>
    <button id="proximo" type="button">Próximo ›</button>
  </div>
</div>

<script>
// Aulas em desenho do dia 2 (Pablo, 11/11/2026: "preciso de uma imagem para entender").
// Fonte única: o site (components/simulado/aula-do-tema.tsx) e a prévia
// (scripts/gerar-aulas-em-desenho.mjs) leem daqui. SVG escrito à mão, sem IA.
// Classes do desenho (tinta, agua, calor...) ficam em app/globals.css (.aula-desenho).

const seta = (x1, y1, x2, y2, cls = 'tinta') => {
  const a = Math.atan2(y2 - y1, x2 - x1), s = 7;
  const p1 = [x2 - s * Math.cos(a - 0.45), y2 - s * Math.sin(a - 0.45)];
  const p2 = [x2 - s * Math.cos(a + 0.45), y2 - s * Math.sin(a + 0.45)];
  return `<path class="${cls}" d="M${x1} ${y1} L${x2} ${y2} M${p1} L${x2} ${y2} L${p2}"/>`;
};
const quadrinhos = (x, y, cols, rows, lado, pintados, cls = 'cheio') => {
  let s = '';
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    s += `<rect x="${x + c * lado}" y="${y + r * lado}" width="${lado - 2}" height="${lado - 2}" rx="2" class="${i < pintados ? cls : 'fundo'}"/>`;
  }
  return s;
};
const torre = (x, base, n, cls) => Array.from({ length: n }, (_, i) =>
  `<rect x="${x}" y="${base - (i + 1) * 18}" width="26" height="16" rx="2" class="${cls}"/>`).join('');

const AULAS = [
// ---------------- FÍSICA ----------------
{ m: 'Física', t: 'Eletricidade e Circuitos',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Caixa d'água empurrando água por uma mangueira com um aperto até uma roda">
    <rect x="12" y="14" width="58" height="46" rx="4" class="agua"/>
    <text x="14" y="78" class="t-calor">U: a força</text><text x="14" y="92" class="t-fraco">que empurra</text>
    <path d="M70 48 H100 V150 H190" stroke="var(--line)" stroke-width="16" fill="none" stroke-linejoin="round"/>
    <path d="M190 150 H240" stroke="var(--line)" stroke-width="7" fill="none"/>
    <path d="M240 150 H272" stroke="var(--line)" stroke-width="16" fill="none"/>
    <path class="fluxo" d="M70 48 H100 V150 H272"/>
    <text x="112" y="182" class="t-agua">i: a água passando</text>
    ${seta(215, 112, 215, 140, 'tinta')}<text x="186" y="106" class="t-forte">R: o aperto</text>
    <g class="gira"><circle cx="300" cy="150" r="24" class="realce"/>
      <path class="tinta" d="M300 126 V174 M276 150 H324 M283 133 L317 167 M317 133 L283 167"/></g>
    <text x="270" y="112" class="t-forte">P: a roda</text>
  </svg>`,
  pecas: [['A força que empurra a água', 'tensão U (volts)'], ['Quanta água passa por segundo', 'corrente i (ampères)'], ['O aperto na mangueira', 'resistência R (ohms)'], ['O trabalho da roda a cada segundo', 'potência P (watts)'], ['Quanto tempo a torneira fica aberta', 'energia = P × tempo']],
  sentido: 'Com o mesmo aperto, mais força faz passar mais água: U = R × i. E a roda gira mais forte quando tem muita força E muita água: P = U × i. Torneira aberta por mais tempo gasta mais: é a conta de luz.',
  conta: '<strong>Exemplo:</strong> uma lâmpada em 110 V com 0,5 A. P = 110 × 0,5 = 55 W. Ligada 10 horas: 55 × 10 = 550 Wh = 0,55 kWh.' },

{ m: 'Física', t: 'Termodinâmica e Calor',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Panela com água no fogo e um termômetro">
    <rect x="96" y="66" width="130" height="66" rx="6" class="agua"/>
    <path class="tinta" d="M86 66 H236"/>
    <text x="118" y="104" class="t-agua">m: quanta água</text>
    <path class="calor" d="M120 186 q12 -36 24 0 z M150 186 q12 -46 24 0 z M180 186 q12 -36 24 0 z"/>
    <path class="sobe" d="M132 160 V138 M162 156 V138 M192 160 V138"/>
    <text x="14" y="176" class="t-calor">Q: o calor</text><text x="14" y="190" class="t-fraco">que entra</text>
    <rect x="262" y="40" width="16" height="104" rx="8" class="fundo"/>
    <rect x="266" y="70" width="8" height="70" rx="4" class="cheio-calor"/>
    <circle cx="270" cy="152" r="12" class="cheio-calor"/>
    <text x="222" y="30" class="t-calor">ΔT: quanto subiu</text>
    <text x="14" y="40" class="t-forte">c: o "preço"</text><text x="14" y="54" class="t-fraco">de cada grau</text>
  </svg>`,
  pecas: [['O fogo mandando energia', 'calor Q (calorias)'], ['Quanta água tem na panela', 'massa m (gramas)'], ['Quanto o termômetro subiu', 'variação ΔT (°C)'], ['Quanto cada grama "cobra" por grau', 'calor específico c']],
  sentido: 'Mais água precisa de mais fogo. Subir mais graus também. Por isso tudo se multiplica: Q = m × c × ΔT. Água cobra 1 caloria por grama por grau, e é por isso que demora a esquentar.',
  conta: '<strong>Exemplo:</strong> 300 g de água de 20 °C para 60 °C. ΔT = 40. Q = 300 × 1 × 40 = 12 000 cal.' },

{ m: 'Física', t: 'Ondas e Acústica',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Onda andando com o comprimento de onda marcado entre duas cristas">
    <defs><clipPath id="corte"><rect x="10" y="40" width="320" height="120"/></clipPath></defs>
    <g clip-path="url(#corte)"><g class="onda">
      <path class="tinta" style="stroke:var(--water);stroke-width:3" d="M-190 110 Q-165 60 -140 110 T-90 110 T-40 110 T10 110 T60 110 T110 110 T160 110 T210 110 T260 110 T310 110 T360 110"/>
    </g></g>
    <path class="tinta" d="M35 40 V30 H135 V40"/>
    <text x="52" y="24" class="t-forte">λ: de crista a crista</text>
    <circle cx="235" cy="85" r="7" class="cheio-calor"/>
    <text x="196" y="186" class="t-calor">f: cristas por segundo</text>
    ${seta(20, 186, 120, 186)}<text x="20" y="176" class="t-agua">v: a onda anda</text>
  </svg>`,
  pecas: [['A distância de uma crista à outra', 'comprimento de onda λ (metros)'], ['Quantas cristas passam por segundo', 'frequência f (hertz)'], ['Quanto a onda anda por segundo', 'velocidade v (m/s)']],
  sentido: 'É como andar a passos: cada passo tem o tamanho λ e você dá f passos por segundo. Então anda λ × f por segundo: v = λ × f. Som agudo tem f alto e λ curto; grave, o contrário.',
  conta: '<strong>Exemplo:</strong> som de 680 Hz no ar (340 m/s). λ = v ÷ f = 340 ÷ 680 = 0,5 m.' },

{ m: 'Física', t: 'Óptica',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Raio de luz desviando ao passar do ar para a água e uma parte voltando">
    <rect x="10" y="100" width="320" height="90" class="agua"/>
    <text x="16" y="30" class="t-fraco">ar</text><text x="16" y="182" class="t-agua">água</text>
    <path class="tinta-f" d="M170 20 V190"/>
    <path class="tinta" style="stroke:var(--warm);stroke-width:3" d="M60 25 L170 100 L218 190"/>
    <path class="tinta" style="stroke:var(--warm);stroke-width:2;stroke-dasharray:5 5" d="M170 100 L280 25"/>
    <text x="40" y="58" class="t-calor">luz chegando</text>
    <text x="196" y="150" class="t-forte">desviou: refração</text>
    <text x="222" y="58" class="t-calor">voltou: reflexão</text>
  </svg>`,
  pecas: [['Luz voltando do espelho ou da água', 'reflexão (ângulo de ida = de volta)'], ['Luz entortando ao entrar na água', 'refração'], ['Lápis que parece quebrado no copo', 'refração no dia a dia']],
  sentido: 'Pense num carrinho saindo do asfalto para a areia em diagonal: a roda que toca a areia primeiro freia e o carrinho vira. A luz faz igual: na água ela anda mais devagar e entorta.',
  conta: '<strong>Na questão:</strong> se a luz muda de meio e desvia, é refração. Se bate e volta, é reflexão.' },

{ m: 'Física', t: 'Dinâmica e Leis de Newton',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Mesmo empurrão em um carrinho vazio e em um carrinho cheio">
    <rect x="100" y="34" width="70" height="34" rx="4" class="realce"/>
    <circle cx="116" cy="76" r="7" class="cheio"/><circle cx="154" cy="76" r="7" class="cheio"/>
    ${seta(30, 50, 94, 50)}<text x="36" y="40" class="t-calor">F</text>
    <path class="tinta-f" d="M182 40 H230 M182 52 H250 M182 64 H230"/>
    <text x="232" y="56" class="t-forte">a grande</text>
    <rect x="100" y="124" width="70" height="34" rx="4" class="realce"/>
    <rect x="106" y="100" width="22" height="24" class="calor"/><rect x="132" y="96" width="30" height="28" class="calor"/>
    <circle cx="116" cy="166" r="7" class="cheio"/><circle cx="154" cy="166" r="7" class="cheio"/>
    ${seta(30, 140, 94, 140)}<text x="36" y="130" class="t-calor">F</text>
    <path class="tinta-f" d="M182 140 H204"/>
    <text x="210" y="144" class="t-fraco">a pequena</text>
    <text x="100" y="194" class="t-fraco">mais massa, mesmo empurrão</text>
  </svg>`,
  pecas: [['O empurrão', 'força F (newtons)'], ['O que tem dentro do carrinho', 'massa m (kg)'], ['Quão rápido ele ganha velocidade', 'aceleração a (m/s²)'], ['A Terra puxando para baixo', 'peso = m × 10']],
  sentido: 'O mesmo empurrão acelera muito o carrinho vazio e pouco o cheio. Para acelerar igual o cheio, precisa empurrar mais: F = m × a.',
  conta: '<strong>Exemplo:</strong> empurrão de 40 N num carrinho de 10 kg. a = F ÷ m = 40 ÷ 10 = 4 m/s².' },

// ---------------- QUÍMICA ----------------
{ m: 'Química', t: 'Química Orgânica',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Molécula de etanol com o grupo OH destacado">
    <path class="tinta" d="M70 100 H220 M100 100 V52 M100 100 V148 M160 100 V52 M160 100 V148 M220 100 H262"/>
    <rect x="200" y="74" width="90" height="52" rx="10" class="calor"/>
    <circle cx="100" cy="100" r="17" class="realce"/><text x="95" y="105" class="t-forte">C</text>
    <circle cx="160" cy="100" r="17" class="realce"/><text x="155" y="105" class="t-forte">C</text>
    <circle cx="220" cy="100" r="14" class="fundo"/><text x="215" y="105">O</text>
    <circle cx="266" cy="100" r="11" class="fundo"/><text x="262" y="105">H</text>
    ${[[100,44],[100,156],[160,44],[160,156],[62,100]].map(([x,y]) => `<circle cx="${x}" cy="${y}" r="11" class="fundo"/><text x="${x-4}" y="${y+5}">H</text>`).join('')}
    <text x="206" y="146" class="t-calor">OH: é álcool</text>
    <text x="14" y="186" class="t-forte">cada C faz 4 ligações</text>
  </svg>`,
  pecas: [['A peça de montar com 4 encaixes', 'carbono (C)'], ['A etiqueta presa na cadeia', 'grupo funcional'], ['Etiqueta OH', 'álcool (etanol)'], ['Etiqueta COOH', 'ácido carboxílico (vinagre)']],
  sentido: 'A cadeia de carbonos é o esqueleto; a etiqueta diz a família. Para achar a função na questão, procure a etiqueta, não o tamanho da cadeia.',
  conta: '<strong>Na questão:</strong> CH3–CH2–OH tem OH preso a carbono comum: álcool. CH3–COOH tem COOH: ácido.' },

{ m: 'Química', t: 'Química Ambiental e Energia',
  svg: `<svg viewBox="0 0 340 200" role="img" aria-label="Cana tirando CO2 do ar e devolvendo; petróleo só somando CO2">
    <ellipse cx="95" cy="34" rx="58" ry="20" class="fundo"/><text x="78" y="39">CO₂ no ar</text>
    <path class="tinta" style="stroke:var(--good);stroke-width:4" d="M70 180 V100 M90 180 V92 M110 180 V104"/>
    <path class="tinta" style="stroke:var(--good)" d="M90 120 q-20 -6 -30 -20 M90 110 q20 -6 30 -20"/>
    ${seta(52, 56, 64, 92)}<text x="2" y="80" class="t-fraco">cana puxa</text>
    ${seta(132, 92, 140, 56)}<text x="140" y="80" class="t-fraco">queima devolve</text>
    <text x="52" y="196" class="t-forte">conta fecha</text>
    <ellipse cx="270" cy="34" rx="58" ry="20" class="calor"/><text x="248" y="39" class="t-calor">CO₂ a mais</text>
    <rect x="248" y="150" width="44" height="34" rx="6" class="fundo"/><text x="250" y="172">petróleo</text>
    ${seta(270, 146, 270, 60)}
    <text x="236" y="196" class="t-calor">só soma</text>
  </svg>`,
  pecas: [['A cana crescendo e puxando CO₂', 'fotossíntese'], ['Queimar o álcool e devolver o mesmo CO₂', 'fonte renovável'], ['Tirar carbono guardado no fundo da terra', 'combustível fóssil'], ['CO₂ a mais no ar', 'efeito estufa maior']],
  sentido: 'O álcool da cana devolve ao ar o CO₂ que a própria cana tirou enquanto crescia: a conta quase zera. O petróleo estava guardado há milhões de anos: queimar só aumenta o total.',
  conta: '<strong>Na questão:</strong> "renovável" = a fonte volta em pouco tempo (cana, vento, sol, água). "Fóssil" = petróleo, carvão, gás natural.' },

    ${quadrinhos(24, 60, 3, 2, 30, 6, 'realce')}
    <text x="24" y="150" class="t-forte">3 × 2 × 2 = 12</text><text x="24" y="166" class="t-fraco">cubinhos de 1 cm³</text>
    ${[150,138,126,114,102,90,78].map((y) => `<ellipse cx="250" cy="${y}" rx="44" ry="12" class="fundo"/>`).join('')}
    <ellipse cx="250" cy="66" rx="44" ry="12" class="calor"/>
    <text x="204" y="186" class="t-calor">base × altura</text>
  </svg>`,
  pecas: [['Quantos cubinhos cabem', 'volume (cm³, m³)'], ['Pilha de moedas iguais', 'cilindro: base × altura'], ['Área de uma moeda', 'π × raio² (π ≈ 3)'], ['Caixa de 1 dm³', '1 litro']],
  sentido: 'Volume é empilhar camadas: a camada do fundo (a base) repetida tantas vezes quanto a altura. Vale para caixa e para cilindro.',
  conta: '<strong>Exemplo:</strong> caixa de 10 cm × 10 cm × 20 cm. Volume = 2 000 cm³ = 2 litros.' },
];

// "Direta ou inversa" (Pablo, 11/11/2026: "fica mais fácil de entender a lógica").
// direta: um dobra, o outro dobra. inversa: um dobra, o outro cai pela metade.
// outra: muda junto, mas não na mesma proporção.
const PROPORCOES = {
  'Eletricidade e Circuitos': [
    ['inversa', 'R e i', 'Mesma força, o dobro de aperto: passa metade da água. Mais resistência, menos corrente.'],
    ['direta', 'U e i', 'Mesmo aperto, o dobro de força: passa o dobro de água.'],
    ['direta', 'tempo e energia', 'O dobro de tempo ligado, o dobro na conta de luz.'],
  ],
  'Termodinâmica e Calor': [
    ['direta', 'Q e m', 'O dobro de água pede o dobro de calor para subir os mesmos graus.'],
    ['inversa', 'm e ΔT', 'O mesmo calor em o dobro de água esquenta a metade.'],
  ],
  'Ondas e Acústica': [
    ['inversa', 'f e λ', 'Mesma velocidade, o dobro de cristas por segundo: cada onda fica com metade do tamanho.'],
    ['direta', 'tempo e distância', 'O som anda o dobro em o dobro do tempo.'],
  ],
  'Dinâmica e Leis de Newton': [
    ['direta', 'F e a', 'O dobro do empurrão, o dobro da aceleração.'],
    ['inversa', 'm e a', 'O mesmo empurrão em o dobro de massa: metade da aceleração.'],
  ],
  'Soluções, pH e Titulação': [
    ['direta', 'pó e concentração', 'O dobro de pó na mesma água: o dobro da concentração.'],
    ['inversa', 'volume e concentração', 'O mesmo pó em o dobro de água: metade da concentração.'],
  ],
  'Estequiometria': [
    ['direta', 'reagente e produto', 'O dobro de reagente, o dobro de produto. Por isso a regra de três funciona.'],
  ],
  'Grandezas e Medidas': [
    ['direta', 'quantidade e preço', 'O dobro de pães, o dobro do preço.'],
    ['inversa', 'pedreiros e dias', 'O dobro de pedreiros, metade dos dias.'],
  ],
  'Funções': [
    ['outra', 'km e preço do táxi', 'Sobe junto, mas não dobra: com bandeirada de R$ 5 e R$ 2 por km, 1 km custa R$ 7 e 2 km custam R$ 9.'],
  ],
  'Geometria Plana': [
    ['direta', 'um lado e a área', 'Dobrar só um lado do retângulo dobra a área.'],
    ['outra', 'os dois lados e a área', 'Dobrar os dois lados multiplica a área por 4.'],

  'Geometria Espacial': [
    ['direta', 'altura e volume', 'Na caixa e no cilindro: o dobro de altura, o dobro de volume.'],
    ['outra', 'raio e volume', 'No cilindro, o dobro do raio multiplica o volume por 4, porque o raio entra ao quadrado.'],
  ],
};

// Desenho da lógica, quando ajuda ver a comparação lado a lado.
const DESENHO_LOGICA = {
  'Eletricidade e Circuitos': `<svg viewBox="0 0 340 200" role="img" aria-label="Mesma caixa d'água: mangueira larga passa muita água, mangueira apertada passa pouca">
    <rect x="12" y="20" width="44" height="40" rx="4" class="agua"/>
    <rect x="12" y="120" width="44" height="40" rx="4" class="agua"/>
    <text x="12" y="98" class="t-calor">mesma força U</text>
    <path d="M56 50 H320" stroke="var(--line)" stroke-width="16" fill="none"/>
    <path class="fluxo" d="M56 50 H320"/>
    <text x="70" y="30" class="t-forte">R pequeno</text>
    <text x="150" y="80" class="t-agua">i grande: muita água</text>
    <path d="M56 150 H180" stroke="var(--line)" stroke-width="16" fill="none"/>
    <path d="M180 150 H260" stroke="var(--line)" stroke-width="5" fill="none"/>
    <path d="M260 150 H320" stroke="var(--line)" stroke-width="16" fill="none"/>
    <path class="fluxo-pouco" d="M56 150 H320"/>
    <text x="190" y="132" class="t-forte">R grande</text>
    <text x="150" y="184" class="t-agua">i pequeno: pouca água</text>
  </svg>`,
};

const MATERIAS = ['Física', 'Química', 'Biologia', 'Matemática'];
let atual = 0;
try { atual = Math.min(AULAS.length - 1, Math.max(0, Number(localStorage.getItem('aula-desenho')) || 0)); } catch (e) { atual = 0; }

const abas = document.getElementById('abas');
abas.innerHTML = MATERIAS.map((m) => `<button type="button" data-m="${m}">${m}</button>`).join('');
abas.addEventListener('click', (e) => {
  const m = e.target.closest('button')?.dataset.m;
  if (m) mostrar(AULAS.findIndex((a) => a.m === m));
});

const SELO = { direta: 'Direta', inversa: 'Inversa', outra: 'Nem direta nem inversa' };
function logica(t) {
  const p = PROPORCOES[t];
  if (!p) return '';
  const desenho = DESENHO_LOGICA[t] ? `<figure>${DESENHO_LOGICA[t]}</figure>` : '';
  return `<section><h2>Direta ou inversa</h2>${desenho}<ul class="prop">${p.map(([tipo, par, ex]) =>
    `<li><span class="cab"><span class="selo selo-${tipo}">${SELO[tipo]}</span>${par}</span><span>${ex}</span></li>`).join('')}</ul></section>`;
}
function mostrar(i) {
  atual = i;
  const a = AULAS[i];
  document.getElementById('cartao').innerHTML = `
    <div><p class="olho">${a.m}</p><h1>${a.t}</h1></div>
    <figure>${a.svg}</figure>
    <div class="grade">
      <section><h2>O que é o quê</h2><ul class="pecas">${a.pecas.map(([img, nome]) => `<li><span>${img}</span><span class="seta">→</span><b>${nome}</b></li>`).join('')}</ul></section>
      <section><h2>Por que faz sentido</h2><p class="texto">${a.sentido}</p><div class="conta">${a.conta}</div></section>
    </div>${logica(a.t)}`;
  document.getElementById('contador').textContent = `${i + 1} de ${AULAS.length}`;
  abas.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.m === a.m)));
  document.getElementById('voltar').disabled = i === 0;
  document.getElementById('proximo').disabled = i === AULAS.length - 1;
  try { localStorage.setItem('aula-desenho', String(i)); } catch (e) { /* sem memória: tudo bem */ }
}
document.getElementById('voltar').onclick = () => atual > 0 && mostrar(atual - 1);
document.getElementById('proximo').onclick = () => atual < AULAS.length - 1 && mostrar(atual + 1);
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && atual < AULAS.length - 1) mostrar(atual + 1);
  if (e.key === 'ArrowLeft' && atual > 0) mostrar(atual - 1);
});
mostrar(atual);
</script>
