<title>Contar sem decorar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: uma tela por ideia. Palco = lousa verde com giz; fora dele o tema claro/escuro. Nada de rolagem. */
:root {
  --bg: #eef3ec; --fg: #16241d; --muted: #4d6357; --wood: #7a5c3a;
  --board: #1b3b30; --chalk: #f3f1e6; --chalk2: #b9d3c4; --mark: #f2d14a;
  --blue: #7fd1ff; --coral: #ff8d7a; --green: #8fe39b; --bad: #ff8d7a;
  --f-title: "Jersey 10", "Courier New", monospace; --f-body: "Nunito", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1813; --fg: #e8f1ea; --muted: #a4b9ac; --wood: #a07f55; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0d1813; --fg: #e8f1ea; --muted: #a4b9ac; --wood: #a07f55; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 18px; line-height: 1.4;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
#app { height: 100%; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding-block: 10px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 700; }
.bar { flex: 1; height: 8px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
.bar i { display: block; height: 100%; width: 0; background: var(--mark); transition: width .25s steps(6); }
/* o palco */
#stage { flex: 1; min-height: 0; margin: 6px; background: var(--board); color: var(--chalk); padding: 18px 20px; display: flex; flex-direction: column; justify-content: center; gap: 14px; overflow: hidden;
  box-shadow: 0 -6px 0 0 var(--wood), 0 6px 0 0 var(--wood), -6px 0 0 0 var(--wood), 6px 0 0 0 var(--wood); }
#stage .in { display: flex; flex-direction: column; gap: 14px; animation: aparece .25s ease-out; }
@keyframes aparece { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
h1, h2 { font-family: var(--f-title); font-weight: 400; margin: 0; line-height: 1; letter-spacing: .02em; text-wrap: balance; }
h1 { font-size: clamp(46px, 11vw, 80px); } h2 { font-size: clamp(30px, 6.4vw, 44px); }
p { margin: 0; } .small { font-size: 15px; color: var(--chalk2); }
.y { color: var(--mark); } .b { color: var(--blue); } .c { color: var(--coral); } .g { color: var(--green); }
.caixa { background: var(--mark); color: #1b2a22; padding: 10px 14px; font-weight: 800; font-size: clamp(20px, 4.6vw, 28px); align-self: flex-start;
  box-shadow: 0 -3px 0 0 #1b2a22, 0 3px 0 0 #1b2a22, -3px 0 0 0 #1b2a22, 3px 0 0 0 #1b2a22; margin: 3px; }
.grande { font-family: var(--f-title); font-size: clamp(44px, 10vw, 72px); line-height: 1; }
/* casas (slots) */
.casas { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.casa { min-width: 84px; padding: 8px 10px; text-align: center; border: 3px dashed var(--chalk2); display: flex; flex-direction: column; gap: 2px; }
.casa small { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--chalk2); }
.casa b { font-family: var(--f-title); font-weight: 400; font-size: 40px; line-height: 1; min-height: 40px; }
.casa.on { border-style: solid; border-color: var(--mark); } .casa.on b { color: var(--mark); }
.casa.novo { animation: aparece .25s ease-out; }
.op { align-self: center; font-family: var(--f-title); font-size: 36px; color: var(--chalk2); }
/* fichas */
.fichas { display: flex; gap: 8px; flex-wrap: wrap; }
.ficha { padding: 6px 12px; font-weight: 800; color: #1b2a22; font-size: 16px; }
.ficha.b { background: var(--blue); color: #1b2a22; } .ficha.c { background: var(--coral); color: #1b2a22; } .ficha.g { background: var(--green); color: #1b2a22; } .ficha.y { background: var(--mark); color: #1b2a22; } .ficha.w { background: var(--chalk); color: #1b2a22; }
svg { width: 100%; max-height: 38vh; height: auto; }
.quad { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; max-width: 360px; }
.quad i { aspect-ratio: 1; background: var(--chalk2); opacity: .55; }
.quad i.x { background: var(--mark); opacity: 1; animation: aparece .25s ease-out; }
/* escolhas */
.op-lista { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.opt { font: inherit; font-family: var(--f-title); font-size: 34px; line-height: 1; padding: 14px 10px; background: transparent; color: var(--chalk); border: 3px solid var(--chalk2); cursor: pointer; transition: transform .12s; }
.opt:active { transform: translateY(3px); }
.opt.certo { background: var(--green); color: #1b2a22; border-color: var(--green); }
.opt.errado { background: var(--coral); color: #1b2a22; border-color: var(--coral); }
.opt[disabled] { cursor: default; }
.resp { font-size: 17px; min-height: 48px; }
/* controles */
.ctrl { display: flex; gap: 10px; margin: 4px; }
.btn { font: inherit; font-family: var(--f-title); font-size: 30px; line-height: 1; padding: 12px 18px; background: var(--mark); color: #1b2a22; border: 0; cursor: pointer; flex: 1;
  box-shadow: 0 4px 0 0 #8c7416, 0 -3px 0 0 #1b2a22, 0 3px 0 0 #1b2a22, -3px 0 0 0 #1b2a22, 3px 0 0 0 #1b2a22; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 0 #8c7416, 0 -3px 0 0 #1b2a22, 0 3px 0 0 #1b2a22, -3px 0 0 0 #1b2a22, 3px 0 0 0 #1b2a22; }
.btn.volta { flex: 0 0 auto; background: transparent; color: var(--fg); box-shadow: 0 -3px 0 0 var(--fg), 0 3px 0 0 var(--fg), -3px 0 0 0 var(--fg), 3px 0 0 0 var(--fg); }
.btn[hidden] { display: none; } .btn[disabled] { opacity: .45; cursor: default; }
button { -webkit-tap-highlight-color: transparent; } button:focus { outline: none; } button:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
@media (max-width: 480px) { #stage { padding: 14px; gap: 10px; } .casa { min-width: 70px; } .casa b { font-size: 34px; } body { font-size: 17px; } .opt { font-size: 30px; } }
@media (max-height: 620px) { #stage { padding: 10px 14px; gap: 8px; } #stage .in { gap: 8px; } .casa b { font-size: 30px; min-height: 30px; } svg { max-height: 30vh; } }
</style>

<div id="app">
  <div class="top"><span id="n">1/1</span><div class="bar"><i id="barra"></i></div><span>Contar sem decorar</span></div>
  <div id="stage"></div>
  <div class="ctrl"><button class="btn volta" id="volta" aria-label="Voltar">←</button><button class="btn" id="prox">Próximo</button></div>
</div>

<script>
(function () {
  // ---------- peças ----------
  var casa = function (rot, val, on, novo) { return '<div class="casa' + (on ? ' on' : '') + (novo ? ' novo' : '') + '"><small>' + rot + '</small><b>' + (val == null ? '' : val) + '</b></div>'; };
  var op = function (s) { return '<span class="op">' + s + '</span>'; };
  var caixa = function (t) { return '<div class="caixa">' + t + '</div>'; };
  var no = function (x, y, cor) { return '<rect x="' + (x - 7) + '" y="' + (y - 7) + '" width="14" height="14" fill="' + cor + '"/>'; };
  var BER = [['#7fd1ff', 'azul'], ['#f2d14a', 'amarela'], ['#ff8d7a', 'vermelha']];
  var YS = [40, 110, 180];

  // árvore de roupas: nivel 1 = só bermudas, nivel 2 = com camisas
  function arvore(nivel) {
    var s = '<svg viewBox="0 0 360 220" role="img" aria-label="Árvore: 3 bermudas e, para cada uma, 2 camisas">';
    s += no(20, 110, '#f3f1e6');
    for (var i = 0; i < 3; i++) {
      s += '<line x1="27" y1="110" x2="123" y2="' + YS[i] + '" stroke="#b9d3c4" stroke-width="3"/>' + no(130, YS[i], BER[i][0]);
      if (nivel > 1) {
        for (var j = 0; j < 2; j++) {
          var y = YS[i] + (j ? 20 : -20);
          s += '<line x1="137" y1="' + YS[i] + '" x2="243" y2="' + y + '" stroke="#b9d3c4" stroke-width="3"/>' + no(250, y, j ? '#f3f1e6' : '#8fe39b');
        }
      }
    }
    if (nivel > 1) s += '<text x="278" y="115" fill="#f2d14a" font-family="Jersey 10, monospace" font-size="46">= 6</text>';
    return s + '</svg>';
  }
  function moedas(destaque) {
    var h = '<div class="quad" role="img" aria-label="16 caminhos de 4 lançamentos">';
    for (var i = 0; i < 16; i++) h += '<i class="' + (destaque && i === 0 ? 'x' : '') + '"></i>';
    return h + '</div>';
  }

  // ---------- as telas ----------
  var T = [];
  function tela(html, extra) { T.push({ html: html, extra: extra || {} }); }

  tela('<p class="small">Aula amostra · jeito Universo Narrado</p><h1>Contar sem <span class="y">decorar</span></h1><p>Árvore, casas e chance. Sem fórmula nenhuma no começo: ela nasce do desenho.</p><p class="small">Cai ~4 vezes por prova de Matemática (64 questões de 2009 a 2023).</p>');

  tela('<h2>Quantas roupas diferentes?</h2><div class="fichas"><span class="ficha b">bermuda azul</span><span class="ficha y">bermuda amarela</span><span class="ficha c">bermuda vermelha</span></div><div class="fichas"><span class="ficha g">camisa lisa</span><span class="ficha w">camisa listrada</span></div><p>3 bermudas e 2 camisas. Pensa e aperta Próximo.</p>');
  tela('<h2>Escolho a <span class="b">bermuda</span></h2>' + arvore(1) + '<p>3 jeitos de começar.</p>');
  tela('<h2>Para cada bermuda, 2 camisas</h2>' + arvore(2) + '<p>Conta as pontas: <b class="y">6</b>.</p>');
  tela('<h2>A árvore virou conta</h2><div class="casas">' + casa('bermudas', 3, 1) + op('×') + casa('camisas', 2, 1) + op('=') + casa('roupas', 6, 1) + '</div>' + caixa('E → multiplica'));
  tela('<h2>Entra um sapato</h2><div class="casas">' + casa('bermudas', 3, 1) + op('×') + casa('camisas', 2, 1) + op('×') + casa('sapatos', 2, 1, 1) + op('=') + casa('roupas', 12, 1, 1) + '</div><p>Cada escolha nova <b class="y">multiplica</b> o que já tinha.</p>');
  tela('<h2>Sapato <span class="y">OU</span> chinelo</h2><div class="casas">' + casa('sapatos', 2, 1) + op('+') + casa('chinelos', 3, 1) + op('=') + casa('calçados', 5, 1) + '</div>' + caixa('E multiplica · OU soma') + '<p class="small">Uma ou outra: não são escolhas empilhadas, são caminhos separados.</p>');

  tela('<h2>Números de 3 algarismos diferentes</h2><div class="casas">' + casa('centena', '', 0) + casa('dezena', '', 0) + casa('unidade', '', 0) + '</div><p>Começa pela casa <b class="y">mais difícil</b>: a centena não pode ser 0.</p>');
  tela('<h2>Centena: 1 a 9</h2><div class="casas">' + casa('centena', 9, 1, 1) + casa('dezena', '', 0) + casa('unidade', '', 0) + '</div><p>9 jeitos. O zero não vale aqui.</p>');
  tela('<h2>Dezena: 0 a 9, menos 1</h2><div class="casas">' + casa('centena', 9, 1) + casa('dezena', 9, 1, 1) + casa('unidade', '', 0) + '</div><p>Já usei 1 algarismo na centena. Sobram 9 (o zero entrou de volta).</p>');
  tela('<h2>Unidade: sobram 8</h2><div class="casas">' + casa('centena', 9, 1) + op('×') + casa('dezena', 9, 1) + op('×') + casa('unidade', 8, 1, 1) + '</div><div class="grande y">9 × 9 × 8 = 648</div>');

  tela('<h2>E os <span class="y">ímpares</span>?</h2><div class="casas">' + casa('centena', '', 0) + casa('dezena', '', 0) + casa('unidade', 5, 1, 1) + '</div><p>De novo: a casa mais restrita primeiro. Unidade ímpar: 1, 3, 5, 7, 9. São 5.</p>');
  tela('<h2>Centena: 1 a 9, menos 1</h2><div class="casas">' + casa('centena', 8, 1, 1) + casa('dezena', '', 0) + casa('unidade', 5, 1) + '</div><p>Tira o zero e tira o que a unidade já usou. Sobram 8.</p>');
  tela('<h2>Dezena: sobram 8</h2><div class="casas">' + casa('centena', 8, 1) + op('×') + casa('dezena', 8, 1, 1) + op('×') + casa('unidade', 5, 1) + '</div><div class="grande y">8 × 8 × 5 = 320</div>');
  tela('<h2>E os pares? Conta o que você <span class="y">não quer</span></h2><div class="casas">' + casa('todos', 648, 1) + op('−') + casa('ímpares', 320, 1) + op('=') + casa('pares', 328, 1, 1) + '</div><p class="small">Às vezes o contrário é mais fácil de contar.</p>');

  tela('<h2>A ordem importa?</h2><div class="fichas"><span class="ficha w">A B</span><span class="ficha w">B A</span></div><p>Duplas de 6 pessoas (A a F). A conta com ordem: <b class="y">6 × 5 = 30</b>.</p><p>Mas A·B e B·A são a mesma dupla. Cada dupla apareceu 2 vezes: <b class="y">30 ÷ 2 = 15</b>.</p>' + caixa('Ordem não importa → divide'));

  tela('<h2>Chance = favoráveis ÷ total</h2><div class="casas">' + casa('moeda', '1/2', 1) + casa('dado: 6', '1/6', 1) + casa('dado: par', '1/2', 1) + '</div><p class="small">Cada lançamento é uma moeda nova. Ela não lembra do anterior.</p>');
  tela('<h2>Iago vai ter 4 filhos</h2><p>Antes de nascer qualquer um: qual a chance de os <b class="y">4</b> serem homens?</p><p>4 lançamentos: 2 × 2 × 2 × 2 = <b class="y">16 caminhos</b>.</p>' + moedas(0));
  tela('<h2>Só 1 caminho é “4 homens”</h2>' + moedas(1) + '<div class="casas">' + casa('½', '', 0) + op('×') + casa('½', '', 0) + op('×') + casa('½', '', 0) + op('×') + casa('½', '', 0) + '</div><div class="grande y">1/16 = 6,25%</div>');
  tela('<h2>Agora nasceram 3 homens. E o 4º?</h2><div class="grande y">continua 1/2</div>' + caixa('A moeda não lembra') + '<p class="small">“Tem que vir menina” é a intuição errada. O que é raro é a sequência inteira, não o próximo.</p>');

  // Prove você
  function prove(pergunta, opcoes, certo, dicas) {
    var h = '<p class="small">Prove você</p><h2>' + pergunta + '</h2><div class="op-lista">';
    opcoes.forEach(function (o, i) { h += '<button class="opt" data-i="' + i + '">' + o + '</button>'; });
    return h + '</div><p class="resp" aria-live="polite"></p>';
  }
  var P1 = { op: ['400', '324', '288', '360'], c: 2, d: {
    0: '400 = 4 × 10 × 10: deixou repetir algarismo. Eles têm que ser diferentes.',
    1: '324 = 4 × 9 × 9: a unidade precisa ser diferente das DUAS casas de antes, então sobram 8.',
    2: 'Isso! Centena 1 a 4 (4) × dezena 9 × unidade 8 = 288.',
    3: '360 = 5 × 9 × 8: contou o 0 na centena, mas número de 3 algarismos não começa com 0.' } };
  var P2 = { op: ['1/8', '1/6', '3/8', '1/2'], c: 0, d: {
    0: 'Isso! ½ × ½ × ½ = 1/8. A árvore tem 8 caminhos e só 1 é “cara, cara, cara”.',
    1: '1/6 é de dado, não de moeda. Cada lançamento tem 2 saídas.',
    2: '3/8 conta 3 caminhos, mas “3 caras” é um caminho só.',
    3: '1/2 é a chance de UMA moeda. Três seguidas multiplicam.' } };
  tela(prove('Quantos números de 3 algarismos diferentes são menores que 500?', P1.op), { prove: P1 });
  tela(prove('Joga a moeda 3 vezes. Chance de sair cara nas 3?', P2.op), { prove: P2 });

  tela('<h1>Resumo</h1><div class="casas">' + casa('E', '×', 1) + casa('OU', '+', 1) + casa('ordem não importa', '÷', 1) + '</div><p>1. Desenha a árvore ou as casas.</p><p>2. Começa pela casa mais restrita.</p><p>3. Se contar o que quer é difícil, conta o que não quer.</p><p>4. Chance: multiplica os ramos, e a moeda não lembra.</p>');

  // ---------- motor ----------
  var i = 0, stage = document.getElementById('stage'), prox = document.getElementById('prox'), volta = document.getElementById('volta');
  var respondeu = {};
  function mostra() {
    var t = T[i];
    stage.innerHTML = '<div class="in">' + t.html + '</div>';
    document.getElementById('n').textContent = (i + 1) + '/' + T.length;
    document.getElementById('barra').style.width = ((i + 1) / T.length * 100) + '%';
    volta.hidden = i === 0;
    prox.textContent = i === 0 ? 'Começar' : (i === T.length - 1 ? 'De novo' : 'Próximo');
    if (t.extra.prove && respondeu[i] != null) marca(respondeu[i]);
    try { history.replaceState(null, '', '#t' + (i + 1)); } catch (e) {}
  }
  function marca(k) {
    var P = T[i].extra.prove, bs = stage.querySelectorAll('.opt');
    bs.forEach(function (b, j) { b.disabled = true; if (j === P.c) b.classList.add('certo'); else if (j === k) b.classList.add('errado'); });
    stage.querySelector('.resp').innerHTML = P.d[k];
  }
  stage.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b || b.disabled) return;
    respondeu[i] = +b.dataset.i; marca(respondeu[i]);
  });
  prox.addEventListener('click', function () { if (i === T.length - 1) { i = 0; respondeu = {}; } else i++; mostra(); });
  volta.addEventListener('click', function () { if (i > 0) { i--; mostra(); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') prox.click(); else if (e.key === 'ArrowLeft') volta.click();
  });
  var h = parseInt((location.hash || '').replace('#t', ''), 10);
  if (h >= 1 && h <= T.length) i = h - 1;
  mostra();
})();
</script>
