<script>
const Q = [{"g": "Degrau 5", "t": "Os bolos da confeitaria", "principal": "ENEM", "tags": ["Função afim + quadrática + gasto fixo", "Degraus 5 + 4 + 1", "Estilo principal: ENEM (com toques dos outros 3)", "Âncora real: ENEM 2022 q.176 (935 letras): parábola, o mês/preço do máximo e um período permitido"], "enun": "Uma confeitaria de bairro quer descobrir o preço ideal do seu bolo de cenoura. Durante três semanas seguidas, o dono mudou o preço e anotou quantos bolos vendeu por semana, como mostra a tabela, e percebeu que a quantidade vendida varia com o preço seguindo uma reta. Cada bolo custa R$ 10 para ser produzido (ingredientes e embalagem), e há um gasto fixo de R$ 300 por semana com o aluguel do forno e a conta de luz. O lucro semanal é o que sobra da venda depois de descontar todos os custos. Por causa de um tabelamento da prefeitura para produtos da cesta básica local, o preço de venda do bolo não pode passar de R$ 25. Escolhendo o preço que dá o maior lucro semanal permitido, esse lucro, em reais, será de:", "tabela": [["Preço do bolo (R$)", "Bolos vendidos por semana"], ["20", "120"], ["24", "104"], ["28", "88"]], "alts": ["R$ 900", "R$ 1 200", "R$ 1 300", "R$ 1 500", "R$ 1 600"], "certa": 1, "erros": {"0": "Usou o menor preço da tabela (R$ 20).", "2": "Usou o vértice p = 30, que passa do teto de R$ 25.", "3": "Esqueceu o gasto fixo de R$ 300.", "4": "Vértice e sem o gasto fixo (20 · 80)."}, "passos": [["A reta das vendas", "Cada R$ 4 a mais no preço tira 16 bolos: são −4 bolos por real. Com 20 → 120, a quantidade é q = 200 − 4p."], ["O lucro", "Lucro = (p − 10)(200 − 4p) − 300. É uma parábola aberta para baixo, com raízes de (p − 10)(200 − 4p) em 10 e 50."], ["O vértice", "Fica no meio das raízes: p = 30. Mas a prefeitura só deixa até 25."], ["Dentro do limite", "A parábola só sobe até 30, então no intervalo permitido o maior valor está em p = 25."], ["A conta", "q = 200 − 100 = 100 bolos. Lucro = 15 · 100 − 300 = 1 200."]], "ancora": "ENEM 2022 q.176 (935 letras): parábola, o mês/preço do máximo e um período permitido"}, {"g": "Degrau 5", "t": "Duas raízes à direita", "principal": "Fuvest", "tags": ["Função quadrática: soma e produto", "Degraus 5 + 4", "Estilo principal: Fuvest (com toques dos outros 3)", "Âncora real: IME 2024 q.4: soma e produto das raízes"], "enun": "Para cada número inteiro k, com 1 ≤ k ≤ 20, considere a parábola y = x² − 6x + k, desenhada no plano cartesiano. Os pontos em que a parábola corta o eixo horizontal são as raízes da equação x² − 6x + k = 0. Em quantos valores de k a parábola corta o eixo horizontal em dois pontos distintos, ambos à direita da origem, isto é, com abscissa positiva?", "alts": ["2", "7", "8", "9", "20"], "certa": 2, "erros": {"0": "Contou só os k de raízes inteiras (k = 5 e k = 8).", "1": "Esqueceu o k = 1.", "3": "Incluiu k = 9, que dá raiz dupla (um ponto só).", "4": "Só exigiu produto positivo, sem olhar o Δ."}, "passos": [["Dois pontos distintos", "Δ = 36 − 4k > 0, então k < 9, isto é, k ≤ 8."], ["Soma e produto das raízes", "A soma é 6 e o produto é k. Com k > 0, as duas raízes têm o mesmo sinal; como a soma é 6 (positiva), as duas são positivas."], ["Contar", "k = 1, 2, 3, 4, 5, 6, 7, 8: são 8 valores."], ["Os que enganam", "k = 9 dá uma raiz só (x = 3, dupla). E as raízes não precisam ser inteiras: só k = 5 e k = 8 têm raízes inteiras."]], "ancora": "IME 2024 q.4: soma e produto das raízes"}, {"g": "Degrau 5", "t": "A máquina de duas passadas", "principal": "ITA", "tags": ["Função composta + sistema", "Degraus 5 + 4", "Estilo principal: ITA (com toques dos outros 3)", "Âncora real: Unicamp 2024 q.64: f(g(x)) e g(f(x)) com um coeficiente a achar; aqui f(f(x))"], "enun": "Uma máquina de moedas transforma um número x em ax + b, com a e b números reais e a > 0. Passando duas vezes pela máquina, qualquer número x vira 9x + 8. Qual é o resultado de uma única passagem do número 5 pela máquina?", "alts": ["−19", "15", "17", "23", "53"], "certa": 2, "erros": {"0": "Usou a = −3 (b = −4), que o enunciado exclui.", "1": "Esqueceu o b: 3 · 5.", "3": "Tomou b = 8: 15 + 8.", "4": "Respondeu duas passadas: 9 · 5 + 8."}, "passos": [["Duas passadas", "f(f(x)) = a(ax + b) + b = a²x + ab + b."], ["Igualar a 9x + 8", "Para todo x: a² = 9 e ab + b = 8."], ["O sinal de a", "a² = 9 dá a = 3 ou a = −3. Como a > 0, fica a = 3."], ["Achar b", "3b + b = 8, então b = 2."], ["Uma passagem", "f(5) = 3 · 5 + 2 = 17."]], "ancora": "Unicamp 2024 q.64: f(g(x)) e g(f(x)) com um coeficiente a achar; aqui f(f(x))"}, {"g": "Degrau 5", "t": "Dez posições depois", "principal": "Harvard", "tags": ["Função afim repetida + aritmética", "Degraus 5 + 1", "Estilo principal: Harvard (com toques dos outros 3)", "Âncora real: Unesp 2025 (PG) e ITA 2025 q.5: sequência que se repete por uma regra"], "enun": "Um aplicativo de fila numera os pedidos assim: o primeiro pedido do dia recebe o número 0. Cada novo pedido recebe o número do anterior multiplicado por 2 e somado com 3 (assim, depois do 0 vem o 3, depois o 9, depois o 21). Qual é o número do pedido que vem 10 posições depois do 0?", "tabela": [["Posição", "0", "1", "2", "3"], ["Número", "0", "3", "9", "21"]], "alts": ["30", "1 023", "3 069", "3 072", "6 141"], "certa": 2, "erros": {"0": "Somou 3 dez vezes.", "1": "Esqueceu o fator 3: 2¹⁰ − 1.", "3": "Esqueceu de tirar o 3 no fim.", "4": "Aplicou 11 vezes: 3 · 2¹¹ − 3."}, "passos": [["O número que não muda", "Quem fica igual na regra: x = 2x + 3, então x = −3."], ["Somar 3 a tudo", "Seja y = x + 3. O próximo é 2x + 3, e 2x + 3 + 3 = 2(x + 3) = 2y. O y simplesmente dobra."], ["O começo", "x = 0 dá y = 3."], ["Depois de 10 passos", "y = 3 · 2¹⁰ = 3 072."], ["Voltar para x", "x = 3 072 − 3 = 3 069."]], "ancora": "Unesp 2025 (PG) e ITA 2025 q.5: sequência que se repete por uma regra"}, {"g": "Degrau 6", "t": "Grama no terreno em L", "principal": "ENEM", "tags": ["Área por subtração + porcentagem + embalagem", "Degraus 6 + 2 + 1", "Estilo principal: ENEM (com toques dos outros 3)", "Âncora real: ENEM 2021 q.152 (1 428 letras) e 2022 q.167: áreas de paredes e piso, escolha por conta"], "enun": "Um sítio de lazer tem um gramado em formato de L: ele é um retângulo de 40 m por 30 m do qual foi retirado, em um dos cantos, um retângulo de 15 m por 10 m, onde fica a casa do caseiro. Todo o terreno que sobrou será coberto com grama em placas. O fornecedor vende a grama em pacotes com 6 placas, e cada placa cobre 1,5 m². Como sempre quebram placas no transporte e no corte das bordas, o engenheiro pediu que o orçamento considere 10% de área a mais do que a área do gramado. Cada pacote custa R$ 54, mas o desconto de 5% para compras acima de 100 pacotes só vale no pagamento à vista, e o cliente vai pagar a prazo. Quantos pacotes devem ser comprados?", "tabela": [["Dado", "Valor"], ["Retângulo grande", "40 m × 30 m"], ["Casa (canto retirado)", "15 m × 10 m"], ["Cada placa", "1,5 m²"], ["Cada pacote", "6 placas"], ["Folga pedida", "10% a mais"]], "alts": ["117", "128", "129", "193", "700"], "certa": 2, "erros": {"0": "Esqueceu os 10% (1 050 ÷ 9 = 116,7).", "1": "Arredondou para baixo: sobra uma parte sem cobrir.", "3": "Esqueceu que cada placa cobre 1,5 m² (1 155 ÷ 6).", "4": "Parou nas placas, sem os 10% (1 050 ÷ 1,5)."}, "passos": [["Área do terreno", "40 · 30 − 15 · 10 = 1 200 − 150 = 1 050 m²."], ["Com 10% a mais", "1 050 · 1,1 = 1 155 m²."], ["Quanto um pacote cobre", "6 placas · 1,5 m² = 9 m²."], ["Pacotes", "1 155 ÷ 9 = 128,33…"], ["Arredondar", "O resto de 0,33 pacote ainda precisa ser coberto: 129 pacotes."]], "ancora": "ENEM 2021 q.152 (1 428 letras) e 2022 q.167: áreas de paredes e piso, escolha por conta"}, {"g": "Degrau 6", "t": "O círculo no triângulo", "principal": "Fuvest", "tags": ["Triângulo retângulo + círculo inscrito", "Degraus 6 + 2", "Estilo principal: Fuvest (com toques dos outros 3)", "Âncora real: Fuvest (repo) q.77 e Unicamp 2024 q.54: circunferência com a medida certa e a área do círculo"], "enun": "Um triângulo retângulo tem lados de 5 cm, 12 cm e 13 cm. Dentro dele, tangente aos três lados, está desenhada uma circunferência. Use π = 3. A área, em cm², da parte do triângulo que fica fora da circunferência é:", "alts": ["12", "18", "26", "27", "30"], "certa": 1, "erros": {"0": "Respondeu a área do círculo.", "2": "Esqueceu o π: 30 − 4.", "3": "Usou o perímetro (30) em vez do semiperímetro: r = 1.", "4": "Não subtraiu o círculo."}, "passos": [["Área do triângulo", "Catetos 5 e 12: 5 · 12 ÷ 2 = 30 cm²."], ["O raio do círculo inscrito", "Área = raio × semiperímetro. O semiperímetro é (5 + 12 + 13) ÷ 2 = 15, então r = 30 ÷ 15 = 2 cm."], ["Área do círculo", "3 · 2² = 12 cm²."], ["O que fica de fora", "30 − 12 = 18 cm²."]], "ancora": "Fuvest (repo) q.77 e Unicamp 2024 q.54: circunferência com a medida certa e a área do círculo"}, {"g": "Degrau 6", "t": "O retângulo na roda", "principal": "ITA", "tags": ["Retângulo inscrito + razão + equação", "Degraus 6 + 4", "Estilo principal: ITA (com toques dos outros 3)", "Âncora real: IME 2024 q.14: figura inscrita e o raio que se descobre pela geometria"], "enun": "Um retângulo tem lados na razão 3 : 4 e perímetro 28 cm. Ele está inscrito numa circunferência, isto é, os quatro vértices estão sobre ela. Use π = 3,14. A área, em cm², da região do círculo que fica fora do retângulo é:", "alts": ["2,24", "30,5", "78,5", "105,86", "266"], "certa": 1, "erros": {"0": "Usou r = 4 (metade do lado maior).", "2": "Não subtraiu o retângulo.", "3": "Usou r = 7 (semiperímetro).", "4": "Usou a diagonal (10) como raio."}, "passos": [["Os lados", "3k e 4k: o perímetro é 14k = 28, então k = 2 e os lados medem 6 e 8."], ["A ideia que destrava", "Um ângulo reto inscrito enxerga um diâmetro. Então a diagonal do retângulo é o diâmetro do círculo."], ["O raio", "Diagonal = √(6² + 8²) = 10, então o raio é 5."], ["As áreas", "Círculo: 3,14 · 25 = 78,5. Retângulo: 6 · 8 = 48."], ["O que fica de fora", "78,5 − 48 = 30,5 cm²."]], "ancora": "IME 2024 q.14: figura inscrita e o raio que se descobre pela geometria"}, {"g": "Degrau 6", "t": "Grama e flores", "principal": "Harvard", "tags": ["Áreas de triângulos + custo", "Degraus 6 + 1", "Estilo principal: Harvard (com toques dos outros 3)", "Âncora real: IME 2024 q.8: área do triângulo pela altura que não muda"], "enun": "Um canteiro retangular tem 12 m de largura (lado AB, embaixo) e 8 m de altura. O ponto P está sobre o lado de cima, a 5 m do vértice D (o de cima, à esquerda). Os segmentos PA e PB dividem o canteiro em três triângulos: o do meio, ABP, receberá flores a R$ 35 por m²; os das laterais, ADP e BCP, serão gramados a R$ 20 por m². O custo total do plantio, em reais, é:", "alts": ["960", "1 680", "2 640", "3 360", "3 600"], "certa": 2, "erros": {"0": "Só a grama.", "1": "Só as flores.", "3": "Triângulo do meio sem o ½ (96 m²) e nada de grama.", "4": "Laterais sem o ½ (96 m² a R$ 20) mais as flores."}, "passos": [["O triângulo do meio", "Base AB = 12 e altura 8: ½ · 12 · 8 = 48 m²."], ["Os das laterais", "ADP: ½ · 5 · 8 = 20. BCP: ½ · 7 · 8 = 28. Juntos: 48 m²."], ["O truque", "O retângulo tem 96 m². O do meio é sempre metade dele, onde quer que P esteja; as laterais ficam com a outra metade."], ["O custo", "48 · 35 + 48 · 20 = 1 680 + 960 = 2 640."]], "ancora": "IME 2024 q.8: área do triângulo pela altura que não muda"}, {"g": "Degrau 7", "t": "Copos de suco", "principal": "ENEM", "tags": ["Cilindro + cone + semelhança", "Degraus 7 + 6 + 2", "Estilo principal: ENEM (com toques dos outros 3)", "Âncora real: ENEM 2022 q.169 (631 letras) e q.147: volume de cilindro e razão ao cubo"], "enun": "Numa lanchonete, o suco de laranja é preparado em garrafas de vidro cilíndricas que têm 10 cm de diâmetro interno e 24 cm de altura. No fim do dia, sobrou uma garrafa com suco até 3/4 da altura. O dono decidiu servir esse resto de graça numa degustação, em copos de papel em forma de cone, com 10 cm de diâmetro na boca e 9 cm de altura. Para o suco não derramar, cada copo é servido só até 80% da altura (e não até a borda), e o dono não quer servir copos pela metade nem com quantidades diferentes. Ele pergunta quantos copos desses consegue servir completamente com o suco que sobrou. Considere que o suco não faz espuma e que nada se perde ao servir. O número de copos é:", "tabela": [["Peça", "Medidas"], ["Garrafa", "diâmetro 10 cm, altura 24 cm, suco até 3/4"], ["Copo (cone)", "diâmetro 10 cm, altura 9 cm"], ["Servir", "até 80% da altura do copo"]], "alts": ["6", "7", "11", "12", "15"], "certa": 2, "erros": {"0": "Encheu os copos até a borda.", "1": "Tratou 80% da altura como 80% do volume.", "3": "Arredondou para cima: o 12º copo não enche.", "4": "Esqueceu que a garrafa só tem 3/4 do suco."}, "passos": [["O suco da garrafa", "Raio 5 e altura 18 (3/4 de 24): π · 25 · 18 = 450π cm³."], ["O copo cheio", "Cone de raio 5 e altura 9: ⅓ · π · 25 · 9 = 75π cm³."], ["O copo a 80% da altura", "O suco forma um cone menor, semelhante ao copo, com razão 0,8. O volume cresce com o cubo: 0,8³ = 0,512, então 75π · 0,512 = 38,4π."], ["Quantos copos", "450π ÷ 38,4π = 11,72…"], ["Só os completos", "11 copos."]], "ancora": "ENEM 2022 q.169 (631 letras) e q.147: volume de cilindro e razão ao cubo"}, {"g": "Degrau 7", "t": "A vareta na caixa", "principal": "Fuvest", "tags": ["Bloco retangular + Pitágoras duas vezes", "Degraus 7 + 6", "Estilo principal: Fuvest (com toques dos outros 3)", "Âncora real: Fuvest (repo) q.76: sólido com medidas e uma conta de cada vez"], "enun": "Uma caixa de papelão tem a forma de um bloco retangular de 6 cm × 8 cm × 24 cm. Um artesão quer guardar nela uma vareta reta, inteira e sem dobrar, com comprimento em centímetros dado por um número inteiro. A vareta pode ficar em qualquer posição dentro da caixa, podendo encostar nas paredes e nos cantos. Qual é o maior comprimento, em cm, que a vareta pode ter?", "alts": ["10", "24", "25", "26", "38"], "certa": 3, "erros": {"0": "Parou na diagonal da base.", "1": "Pegou a maior aresta.", "2": "Achou que a diagonal exata não cabe; o enunciado deixa encostar nos cantos.", "4": "Somou as três medidas (6 + 8 + 24)."}, "passos": [["O maior segmento dentro de um bloco", "É a diagonal, de um canto ao canto oposto."], ["Diagonal da base", "√(6² + 8²) = √100 = 10 cm."], ["Diagonal do bloco", "√(10² + 24²) = √676 = 26 cm."], ["Cabe?", "Uma vareta de exatamente 26 cm vai de canto a canto e encosta neles, o que o enunciado permite. Resposta: 26."]], "ancora": "Fuvest (repo) q.76: sólido com medidas e uma conta de cada vez"}, {"g": "Degrau 7", "t": "O corte na pirâmide", "principal": "ITA", "tags": ["Volume + semelhança de sólidos", "Degraus 7 + 6", "Estilo principal: ITA (com toques dos outros 3)", "Âncora real: ENEM 2022 q.147 (volume vai com o cubo) e aulas fuv (tetraedro cortado)"], "enun": "Uma pirâmide de base quadrada tem 12 cm de altura. Um plano paralelo à base corta a pirâmide em duas partes: uma pirâmide menor, na ponta de cima, e um tronco, embaixo. O volume do tronco é 26 vezes o volume da pirâmide menor. A que distância da base, em cm, passa o plano de corte?", "alts": ["4", "6", "8", "9,7", "11,5"], "certa": 2, "erros": {"0": "Mediu a partir do ápice, não da base.", "1": "Achou que o corte fica no meio.", "3": "Tratou 1/27 como razão de áreas (tirou raiz quadrada).", "4": "Usou 1/26 como razão de alturas."}, "passos": [["O todo em pedaços", "Pirâmide inteira = menor + tronco = 1 + 26 = 27 vezes a menor."], ["Razão de volumes", "Menor ÷ inteira = 1/27."], ["Sólidos semelhantes", "O volume cresce com o cubo da razão das alturas: k³ = 1/27, então k = 1/3."], ["Altura da menor", "12 ÷ 3 = 4 cm, do ápice até o plano."], ["Distância da base", "12 − 4 = 8 cm."]], "ancora": "ENEM 2022 q.147 (volume vai com o cubo) e aulas fuv (tetraedro cortado)"}, {"g": "Degrau 7", "t": "As bolas na lata", "principal": "Harvard", "tags": ["Esfera + cilindro + frações", "Degraus 7 + 1", "Estilo principal: Harvard (com toques dos outros 3)", "Âncora real: ENEM 2022 q.169: volume de cilindro contra volume de esferas"], "enun": "Uma lata cilíndrica de 1,5 L guarda 3 bolas de tênis idênticas, empilhadas. Cada bola encosta nas paredes da lata e nas bolas vizinhas, e as de cima e de baixo encostam nas tampas, de modo que a altura da lata é a de 3 diâmetros. Tratando as bolas como esferas, quantos mililitros da lata ficam vazios, sem bola? (1 L = 1 000 mL.)", "alts": ["333", "500", "750", "1 000", "1 125"], "certa": 1, "erros": {"0": "Volume de uma bola só (2/9 da lata).", "2": "Achou que as bolas ocupam a metade.", "3": "Respondeu o que as bolas ocupam (2/3).", "4": "Achou que as bolas ocupam só 1/4."}, "passos": [["Dar nome ao raio", "O raio das bolas é r, o mesmo da lata. A altura da lata é 3 · 2r = 6r."], ["A lata", "π · r² · 6r = 6πr³."], ["As 3 bolas", "3 · (4/3)πr³ = 4πr³."], ["Fração ocupada", "4πr³ ÷ 6πr³ = 2/3. As bolas ocupam 2/3 da lata, sem precisar de r."], ["O vazio", "1/3 de 1 500 mL = 500 mL."]], "ancora": "ENEM 2022 q.169: volume de cilindro contra volume de esferas"}];
const FIG = {};
let atual = 0, resp = null, passo = -1;
const $ = s => document.querySelector(s);
function abas() {
  $('#abas').innerHTML = Q.map((q, i) => `<button class="aba px" role="tab" aria-selected="${i === atual}" data-i="${i}">${q.g.slice(-1)}.${Q.filter((x, j) => j < i && x.g === q.g).length + 1} ${q.t}</button>`).join('');
}
function tela() {
  const q = Q[atual], L = 'ABCDE';
  let h = `<div class="tags">${q.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div><h2>${q.t}</h2><p class="enun">${q.enun}</p>`;
  if (q.tabela) h += `<div style="overflow-x:auto"><table>${q.tabela.map((r, i) => `<tr>${r.map(c => i ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('')}</table></div>`;
  if (q.fig) h += FIG[q.fig];
  h += `<div class="alts">${q.alts.map((a, i) => {
    const cls = resp === null ? '' : i === q.certa ? 'certa' : i === resp ? 'errada' : '';
    const dica = resp !== null && i === resp && i !== q.certa ? `<small>${q.erros[i]}</small>` : '';
    return `<button class="alt ${cls}" data-a="${i}" ${resp !== null ? 'disabled' : ''}><b>${L[i]}</b><span>${a}${dica}</span></button>`; }).join('')}</div>`;
  if (resp !== null) h += resp === q.certa ? `<p class="msg ok">Certo!</p>` : `<p class="msg bad">Errou. A certa é a ${L[q.certa]}.</p>`;
  if (q.nota) h += `<p class="nota">${q.nota}</p>`;
  if (resp !== null) {
    h += q.passos.slice(0, passo + 1).map((p, i) => `<div class="passo"><b>${i + 1}. ${p[0]}</b><p>${p[1]}</p></div>`).join('');
    if (passo < q.passos.length - 1) h += `<button class="btn px" id="prox">${passo < 0 ? 'Ver a resolução' : 'Próximo'}</button>`;
    else h += `<p class="erros">Erros típicos já mostrados nas alternativas: cada errada vem de uma conta que parece certa.</p>`;
  }
  $('#q').innerHTML = h;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.i) { atual = +b.dataset.i; resp = null; passo = -1; abas(); tela(); }
  else if (b.dataset.a) { resp = +b.dataset.a; tela(); }
  else if (b.id === 'prox') { passo++; tela(); }
});
abas(); tela();
</script>
